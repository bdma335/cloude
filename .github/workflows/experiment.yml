name: Autonomous Experiment
on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
permissions:
  contents: write
concurrency:
  group: autonomous-experiment-main
  cancel-in-progress: false
jobs:
  run:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, 'Update experiment results')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python experiment-engine/crawler.py
      - run: |
          git config user.name "cloude-experiment-engine"
          git config user.email "actions@users.noreply.github.com"
          git add experiment-engine/state.json experiment-engine/results.json
          git diff --cached --quiet || git commit -m "Update experiment results"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
